name: Tests
# Runs every check on every change: function logic, security rules, and the end-to-end
# emulator run. Nothing here touches the real project.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm --prefix functions ci
      - run: printf 'PANTRY_ANTHROPIC_KEY=emulator-only\nMOVI_ANTHROPIC_KEY=emulator-only\nPALETTE_ANTHROPIC_KEY=emulator-only\n' > functions/.secret.local
      - run: npm test
